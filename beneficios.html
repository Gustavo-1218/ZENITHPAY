<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><meta name="theme-color" content="#020b18"><title>ZenithPay - Assistente de Voz</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;min-height:100%;background:#020b18;color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}.app{width:100%;min-height:100vh;background:#020b18;display:flex;flex-direction:column;margin:auto}.top{height:clamp(72px,12vh,100px);display:grid;grid-template-columns:45px 1fr 45px;align-items:center;padding:15px clamp(15px,5vw,35px) 0;border-bottom:1px solid rgba(255,255,255,.06)}.back,.help{border:0;background:none;color:#fff;cursor:pointer}.back{font-size:42px;font-weight:200}.logo{width:150px;max-height:45px;object-fit:contain;justify-self:center}.help{width:35px;height:35px;border:1px solid #687384;border-radius:50%;font-size:20px;justify-self:end}.content{flex:1;padding:clamp(22px,6vw,40px) clamp(16px,6vw,38px) 25px;display:flex;flex-direction:column}.heading{text-align:center;margin-top:5px}.heading h1{font-size:clamp(25px,7vw,34px);font-weight:400}.heading p{color:#8994a3;font-size:clamp(13px,4vw,16px);margin-top:9px;line-height:1.4}.chat{flex:1;margin-top:clamp(25px,7vw,40px);display:flex;flex-direction:column;gap:16px;overflow-y:auto;padding-bottom:20px}.message{max-width:88%;padding:14px 17px;border-radius:18px;font-size:clamp(14px,4.2vw,17px);line-height:1.45;animation:appear .2s ease}.bot{align-self:flex-start;background:#071c32;border:1px solid rgba(74,99,126,.3);border-bottom-left-radius:5px;color:#e9edf1}.user{align-self:flex-end;background:#cfa13b;color:#081322;border-bottom-right-radius:5px}.time{display:block;font-size:10px;opacity:.5;margin-top:6px}.mic-area{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0 18px}.status{height:25px;color:#9ba5b3;font-size:13px;margin-bottom:9px;text-align:center}.mic{width:clamp(78px,22vw,100px);height:clamp(78px,22vw,100px);border-radius:50%;border:2px solid #dba936;background:#071c32;color:#e3ad38;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 7px rgba(219,169,54,.07),0 0 30px rgba(219,169,54,.08);transition:.2s}.mic:hover{background:#0b2845}.mic:active{transform:scale(.95)}.mic.listening{background:#cfa13b;color:#071321;box-shadow:0 0 0 10px rgba(219,169,54,.13),0 0 40px rgba(219,169,54,.25);animation:pulse 1.2s infinite}.mic-icon{width:25px;height:39px;border:3px solid currentColor;border-radius:16px;position:relative}.mic-icon:before{content:"";position:absolute;width:42px;height:30px;border:3px solid currentColor;border-top:0;border-radius:0 0 22px 22px;left:50%;top:28px;transform:translateX(-50%)}.mic-icon:after{content:"";position:absolute;width:3px;height:10px;background:currentColor;left:50%;bottom:-13px;transform:translateX(-50%);box-shadow:-7px 10px 0 -1px currentColor,7px 10px 0 -1px currentColor}.suggestions{display:flex;gap:8px;overflow-x:auto;padding:0 0 7px}.suggestion{flex:0 0 auto;border:1px solid rgba(219,169,54,.35);background:#071c32;color:#d9dde3;border-radius:20px;padding:9px 13px;font-size:12px;cursor:pointer}.suggestion:hover{border-color:#dba936;color:#e4b13e}.bottom{height:clamp(65px,18vw,82px);border-top:1px solid rgba(74,98,123,.22);display:grid;grid-template-columns:repeat(5,1fr);background:#06162a}.nav{border:0;background:none;color:#8993a1;font-size:clamp(9px,3vw,12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav-icon{font-size:clamp(23px,7vw,29px)}.nav.active{color:#e3ad38}@keyframes pulse{50%{transform:scale(1.04)}}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(min-width:600px){body{display:flex;justify-content:center}.app{max-width:600px;box-shadow:0 0 60px rgba(0,0,0,.35)}}@media(max-width:350px){.content{padding-left:12px;padding-right:12px}.message{font-size:13px}.suggestion{font-size:11px;padding:8px 10px}}@media(max-height:680px) and (max-width:500px){.top{height:65px}.chat{margin-top:18px}.mic-area{padding-bottom:10px}.bottom{height:62px}}</style></head><body><div class="app"><header class="top"><button class="back" onclick="history.back()">‹</button><img src="Zenith.png" class="logo" alt="ZenithPay"><button class="help" onclick="ajuda()">?</button></header><main class="content"><div class="heading"><h1>Assistente Zenith</h1><p>Fale comigo para consultar sua conta.</p></div><div class="chat" id="chat"><div class="message bot">Olá! 👋<br>Sou o assistente da ZenithPay. Você pode perguntar sobre seu saldo, quanto pode investir ou se existe alguma pendência.</div></div><div class="suggestions"><button class="suggestion" onclick="pergunta('Qual meu saldo?')">Qual meu saldo?</button><button class="suggestion" onclick="pergunta('Quanto eu posso investir?')">Quanto posso investir?</button><button class="suggestion" onclick="pergunta('Tem alguma pendência no pagamento?')">Tenho alguma pendência?</button></div><div class="mic-area"><div class="status" id="status">Toque no microfone e fale</div><button class="mic" id="mic" onclick="ouvir()"><span class="mic-icon"></span></button></div></main><nav class="bottom"><button class="nav" onclick="location.href='inicio.html'"><span class="nav-icon">⌂</span><span>Início</span></button><button class="nav" onclick="location.href='transacoes.html'"><span class="nav-icon">↔</span><span>Transações</span></button><button class="nav active"><span class="nav-icon">🎙</span><span>Assistente</span></button><button class="nav"><span class="nav-icon">♧</span><span>Benefícios</span></button><button class="nav"><span class="nav-icon">♙</span><span>Perfil</span></button></nav></div><script>const chat=document.getElementById("chat"),status=document.getElementById("status"),mic=document.getElementById("mic");let reconhecimento=null;if("SpeechRecognition"in window||"webkitSpeechRecognition"in window){const R=window.SpeechRecognition||window.webkitSpeechRecognition;reconhecimento=new R();reconhecimento.lang="pt-BR";reconhecimento.continuous=false;reconhecimento.interimResults=false;reconhecimento.onstart=()=>{status.textContent="Ouvindo... fale agora";mic.classList.add("listening")};reconhecimento.onend=()=>{status.textContent="Toque no microfone e fale";mic.classList.remove("listening")};reconhecimento.onerror=()=>{status.textContent="Não consegui ouvir. Tente novamente.";mic.classList.remove("listening")};reconhecimento.onresult=e=>{const texto=e.results[0][0].transcript;pergunta(texto)}}else{status.textContent="Seu navegador não oferece reconhecimento de voz."}function ouvir(){if(!reconhecimento){alert("Seu navegador não suporta reconhecimento de voz. Tente usar Chrome ou Edge.");return}try{reconhecimento.start()}catch(e){}}function normalizar(t){return t.toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"")}function pergunta(texto){adicionar(texto,"user");const t=normalizar(texto);let resposta="";if(t.includes("saldo")||t.includes("tenho na conta")||t.includes("dinheiro")){resposta="Seu saldo disponível é R$ 25.680,50."}else if(t.includes("investir")||t.includes("investimento")){resposta="Você pode investir até R$ 8.500,00 mantendo uma reserva disponível para suas despesas."}else if(t.includes("pendencia")||t.includes("pendência")||t.includes("pagamento")||t.includes("boleto")){resposta="No momento, você não possui nenhuma pendência de pagamento."}else{resposta="Ainda não consigo responder essa pergunta. Tente perguntar sobre seu saldo, investimentos ou pendências de pagamento."}setTimeout(()=>{adicionar(resposta,"bot");falar(resposta)},500)}function adicionar(texto,tipo){const div=document.createElement("div");div.className="message "+tipo;div.innerHTML=texto+'<span class="time">agora</span>';chat.appendChild(div);chat.scrollTop=chat.scrollHeight}function falar(texto){if("speechSynthesis"in window){speechSynthesis.cancel();const fala=new SpeechSynthesisUtterance(texto);fala.lang="pt-BR";fala.rate=.95;fala.pitch=1;speechSynthesis.speak(fala)}}function ajuda(){adicionar("Você pode perguntar: “Qual meu saldo?”, “Quanto eu posso investir?” ou “Tenho alguma pendência no pagamento?”.","bot");falar("Você pode perguntar sobre seu saldo, investimentos ou pendências de pagamento.")}</script></body></html>
