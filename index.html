<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ZenithPay</title><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;font-family:Arial,sans-serif;background:#050b18 url("Zenithbackground.png") center/cover fixed no-repeat;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.overlay{position:fixed;inset:0;background:rgba(2,7,19,.42);z-index:0}.container{position:relative;z-index:1;width:min(430px,92%);padding:38px 34px;background:rgba(5,12,28,.82);border:1px solid rgba(255,255,255,.12);border-radius:24px;box-shadow:0 25px 80px rgba(0,0,0,.5),0 0 45px rgba(210,170,70,.08);backdrop-filter:blur(16px);text-align:center}.logo{width:190px;max-width:75%;margin:0 auto 30px;display:block}.title{font-size:28px;font-weight:700;margin-bottom:8px}.subtitle{font-size:14px;color:#aeb7c8;margin-bottom:28px}.form{display:flex;flex-direction:column;gap:15px;text-align:left}.field{position:relative}.field label{display:block;font-size:12px;color:#aeb7c8;margin:0 0 7px 3px}.field input{width:100%;height:50px;padding:0 15px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);color:#fff;outline:none;font-size:14px;transition:.2s}.field input:focus{border-color:#d7b45a;box-shadow:0 0 0 3px rgba(215,180,90,.08)}.password{position:relative}.password input{padding-right:48px}.eye{position:absolute;right:14px;bottom:15px;color:#8e98aa;cursor:pointer;font-size:14px}.forgot{text-align:right;margin-top:-5px}.forgot button{background:none;border:0;color:#d7b45a;font-size:12px;cursor:pointer}.main-btn{height:50px;border:0;border-radius:12px;background:linear-gradient(135deg,#e2c16d,#a9822f);color:#101010;font-weight:700;font-size:15px;cursor:pointer;transition:.2s;margin-top:4px}.main-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.switch{margin-top:22px;color:#8993a5;font-size:13px}.switch button{border:0;background:none;color:#d7b45a;font-weight:700;cursor:pointer;font-size:13px}.signup{display:none}.message{font-size:12px;min-height:16px;color:#e4b95b;text-align:center;margin-top:3px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:5;align-items:center;justify-content:center;padding:20px}.modal-box{width:min(360px,100%);background:#07101f;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.6);text-align:center}.modal-box h2{font-size:21px;margin-bottom:9px}.modal-box p{font-size:13px;color:#9da8ba;line-height:1.5;margin-bottom:20px}.modal-box input{width:100%;height:46px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;padding:0 13px;outline:none;margin-bottom:12px}.modal-buttons{display:flex;gap:10px}.modal-buttons button{flex:1;height:44px;border-radius:10px;cursor:pointer;font-weight:600}.cancel{border:1px solid rgba(255,255,255,.12);background:transparent;color:#fff}.recover{border:0;background:#d7b45a;color:#111}@media(max-width:500px){.container{padding:32px 24px}.logo{margin-bottom:25px}.title{font-size:25px}} </style></head><body><div class="overlay"></div><main class="container"><img src="Zenith.png" class="logo" alt="ZenithPay"><section id="login" class="login"><h1 class="title">Bem-vindo de volta</h1><p class="subtitle">Acesse sua conta ZenithPay</p><form class="form" onsubmit="entrar(event)"><div class="field"><label for="usuario">Usuário</label><input id="usuario" type="text" placeholder="Digite seu usuário" autocomplete="username" required></div><div class="field password"><label for="senha">Senha</label><input id="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required><span class="eye" onclick="mostrarSenha('senha',this)">◉</span></div><div class="forgot"><button type="button" onclick="abrirRecuperacao()">Esqueci minha senha</button></div><div id="loginMessage" class="message"></div><button class="main-btn" type="submit">Entrar</button></form><div class="switch">Ainda não possui uma conta? <button type="button" onclick="mostrarCadastro()">Criar conta</button></div></section><section id="cadastro" class="signup"><h1 class="title">Criar conta</h1><p class="subtitle">Comece sua experiência com a ZenithPay</p><form class="form" onsubmit="cadastrar(event)"><div class="field"><label for="nome">Nome completo</label><input id="nome" type="text" placeholder="Digite seu nome" required></div><div class="field"><label for="novoUsuario">Usuário</label><input id="novoUsuario" type="text" placeholder="Crie seu usuário" required></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" placeholder="seuemail@email.com" required></div><div class="field password"><label for="novaSenha">Senha</label><input id="novaSenha" type="password" placeholder="Crie uma senha" required><span class="eye" onclick="mostrarSenha('novaSenha',this)">◉</span></div><div class="field password"><label for="confirmarSenha">Confirmar senha</label><input id="confirmarSenha" type="password" placeholder="Repita sua senha" required><span class="eye" onclick="mostrarSenha('confirmarSenha',this)">◉</span></div><div id="cadastroMessage" class="message"></div><button class="main-btn" type="submit">Criar conta</button></form><div class="switch">Já possui uma conta? <button type="button" onclick="mostrarLogin()">Entrar</button></div></section></main><div id="modal" class="modal"><div class="modal-box"><h2>Recuperar acesso</h2><p>Digite seu e-mail para receber as instruções de recuperação.</p><input id="recuperacaoEmail" type="email" placeholder="seuemail@email.com"><div class="modal-buttons"><button class="cancel" onclick="fecharRecuperacao()">Cancelar</button><button class="recover" onclick="recuperar()">Enviar</button></div></div></div><script>const usuarioPadrao={nome:"Usuário Demo",usuario:"usuario",email:"usuario@zenithpay.com",senha:"1234"};function mostrarCadastro(){document.getElementById("login").style.display="none";document.getElementById("cadastro").style.display="block";limparMensagens()}function mostrarLogin(){document.getElementById("cadastro").style.display="none";document.getElementById("login").style.display="block";limparMensagens()}function limparMensagens(){document.getElementById("loginMessage").textContent="";document.getElementById("cadastroMessage").textContent=""}function mostrarSenha(id,el){const input=document.getElementById(id);input.type=input.type==="password"?"text":"password";el.textContent=input.type==="password"?"◉":"◌"}function getUsuario(){const salvo=localStorage.getItem("zenithUsuario");return salvo?JSON.parse(salvo):usuarioPadrao}function entrar(e){e.preventDefault();const usuario=document.getElementById("usuario").value.trim();const senha=document.getElementById("senha").value;const dados=getUsuario();if((usuario===dados.usuario||usuario===dados.email)&&senha===dados.senha){localStorage.setItem("zenithLogado","true");localStorage.setItem("zenithNome",dados.nome);window.location.href="inicio.html"}else{document.getElementById("loginMessage").textContent="Usuário ou senha incorretos."}}function cadastrar(e){e.preventDefault();const nome=document.getElementById("nome").value.trim();const usuario=document.getElementById("novoUsuario").value.trim();const email=document.getElementById("email").value.trim();const senha=document.getElementById("novaSenha").value;const confirmar=document.getElementById("confirmarSenha").value;if(senha!==confirmar){document.getElementById("cadastroMessage").textContent="As senhas não coincidem.";return}if(senha.length<4){document.getElementById("cadastroMessage").textContent="A senha deve ter pelo menos 4 caracteres.";return}const dados={nome,usuario,email,senha};localStorage.setItem("zenithUsuario",JSON.stringify(dados));localStorage.setItem("zenithLogado","true");localStorage.setItem("zenithNome",nome);window.location.href="inicio.html"}function abrirRecuperacao(){document.getElementById("modal").style.display="flex"}function fecharRecuperacao(){document.getElementById("modal").style.display="none"}function recuperar(){const email=document.getElementById("recuperacaoEmail").value.trim();if(!email){alert("Digite seu e-mail.");return}alert("Se o e-mail estiver cadastrado, você receberá as instruções de recuperação.");fecharRecuperacao()}window.addEventListener("click",e=>{if(e.target===document.getElementById("modal"))fecharRecuperacao()});</script></body></html>
