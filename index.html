<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ZenithPay</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#03142b;color:#fff}body{min-height:100vh;overflow:hidden}.app{position:relative;width:100%;height:100vh;min-height:680px;background:#03142b url("Zenithbackground.png") center center/cover no-repeat;overflow:hidden}.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(1,15,37,.08) 0%,rgba(1,15,37,.02) 45%,rgba(1,15,37,.42) 75%,rgba(1,15,37,.9) 100%);pointer-events:none}.content{position:relative;z-index:2;width:100%;height:100%;max-width:650px;margin:auto;padding:45px 7% 30px;display:flex;flex-direction:column;align-items:flex-start}.logo{width:285px;max-width:72%;height:auto;object-fit:contain;margin:60px auto 48px;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.2))}.welcome{width:100%;margin-top:0}.welcome h1{font-size:40px;font-weight:300;line-height:1.2;letter-spacing:-1.5px}.welcome h1 span{color:#e5aa32}.line{width:90px;height:3px;background:#e5aa32;margin:22px 0 27px}.description{font-size:18px;line-height:1.65;color:#c0c7d2;max-width:370px;font-weight:300}.dots{display:flex;gap:12px;justify-content:center;width:100%;margin-top:auto;margin-bottom:36px}.dot{width:17px;height:17px;border-radius:50%;background:#233c5b}.dot.active{background:#e8ac32}.buttons{width:100%;display:flex;flex-direction:column;gap:16px}.btn{width:100%;height:66px;border-radius:17px;font-size:21px;font-weight:600;cursor:pointer;transition:.2s}.create{background:linear-gradient(135deg,#f0bc46,#d99a24);border:1px solid #f2c45d;color:#081525;box-shadow:0 8px 25px rgba(226,166,45,.12)}.login{background:rgba(2,17,38,.28);border:2px solid #b78326;color:#e5aa32}.btn:active{transform:scale(.98)}.security{display:flex;align-items:center;gap:17px;width:100%;margin-top:38px;padding:0 45px;color:#aab3c1}.shield{width:35px;height:42px;min-width:35px;border:2px solid #bd8a2c;clip-path:polygon(50% 0,92% 15%,88% 65%,50% 100%,12% 65%,8% 15%);position:relative}.shield:after{content:"";position:absolute;width:9px;height:11px;border:2px solid #bd8a2c;border-radius:3px;left:11px;top:16px}.security p{font-size:14px;line-height:1.55}.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:25px;background:rgba(0,7,20,.72);backdrop-filter:blur(8px)}.modal.active{display:flex}.box{width:100%;max-width:390px;background:#06162d;border:1px solid rgba(224,169,51,.42);border-radius:22px;padding:32px 27px;box-shadow:0 25px 70px rgba(0,0,0,.65)}.box-logo{width:150px;display:block;margin:0 auto 20px}.box h2{text-align:center;font-size:25px;font-weight:500;margin-bottom:7px}.box-sub{text-align:center;color:#929eaf;font-size:13px;margin-bottom:24px}.field{margin-bottom:15px}.field label{display:block;color:#aeb8c8;font-size:12px;margin:0 0 7px 2px}.field input{width:100%;height:50px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.055);color:#fff;outline:none;padding:0 14px;font-size:14px}.field input:focus{border-color:#dba83c;box-shadow:0 0 0 3px rgba(219,168,60,.08)}.modal-btn{width:100%;height:50px;border:0;border-radius:11px;background:linear-gradient(135deg,#efbb46,#d69a24);color:#081525;font-size:15px;font-weight:700;cursor:pointer;margin-top:5px}.close{display:block;width:100%;margin-top:15px;background:none;border:0;color:#8e99aa;font-size:13px;cursor:pointer}.error{text-align:center;color:#e8aa39;font-size:12px;min-height:17px;margin-top:8px}.remember{display:flex;align-items:center;gap:7px;color:#8e99aa;font-size:12px;margin:4px 0 10px}.remember input{accent-color:#dba83c}.forgot{text-align:right;margin:-2px 0 16px}.forgot button{border:0;background:none;color:#dca83b;font-size:12px;cursor:pointer}.success{text-align:center;color:#dca83b;font-size:13px;line-height:1.5;margin-top:12px}@media(max-width:600px){.content{padding:30px 8% 25px}.logo{width:275px;max-width:82%;margin:48px auto 42px}.welcome h1{font-size:38px}.description{font-size:17px}.dots{margin-bottom:32px}.btn{height:64px;font-size:20px}.security{padding:0 42px;margin-top:34px}.security p{font-size:13px}}@media(max-height:760px){.content{padding-top:20px}.logo{margin:20px auto 25px;width:230px}.welcome h1{font-size:32px}.line{margin:14px 0 17px}.description{font-size:15px}.dots{margin-bottom:20px}.btn{height:55px}.security{margin-top:20px}.security p{font-size:12px}}@media(min-width:700px){.app{max-width:650px;margin:auto;box-shadow:0 0 80px rgba(0,0,0,.45)}} </style></head><body><div class="app"><div class="shade"></div><main class="content"><img src="Zenith.png" class="logo" alt="ZenithPay"><section class="welcome"><h1>Bem-vindo<br>ao seu novo<br><span>horizonte financeiro</span></h1><div class="line"></div><p class="description">Soluções inteligentes para organizar, investir e fazer seu dinheiro crescer.</p></section><div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div><div class="buttons"><button class="btn create" onclick="abrirCadastro()">Criar minha conta</button><button class="btn login" onclick="abrirLogin()">Entrar</button></div><div class="security"><div class="shield"></div><p>Segurança e privacidade em primeiro lugar.<br>Seus dados estão protegidos.</p></div></main></div><div class="modal" id="loginModal"><div class="box"><img src="Zenith.png" class="box-logo"><h2>Entrar</h2><p class="box-sub">Acesse sua conta ZenithPay</p><form onsubmit="login(event)"><div class="field"><label>Usuário</label><input id="usuario" type="text" placeholder="Digite seu usuário" required></div><div class="field"><label>Senha</label><input id="senha" type="password" placeholder="Digite sua senha" required></div><div class="remember"><input type="checkbox" id="lembrar"><label for="lembrar">Lembrar de mim</label></div><div class="forgot"><button type="button" onclick="alert('Para esta demonstração, use o usuário usuário e a senha 1234.')">Esqueci minha senha</button></div><button class="modal-btn" type="submit">Entrar</button><div class="error" id="loginError"></div></form><button class="close" onclick="fecharModais()">Voltar</button></div></div><div class="modal" id="cadastroModal"><div class="box"><img src="Zenith.png" class="box-logo"><h2>Criar conta</h2><p class="box-sub">Comece seu novo horizonte financeiro</p><form onsubmit="cadastro(event)"><div class="field"><label>Nome completo</label><input id="nome" type="text" placeholder="Seu nome completo" required></div><div class="field"><label>Usuário</label><input id="novoUsuario" type="text" placeholder="Crie seu usuário" required></div><div class="field"><label>E-mail</label><input id="email" type="email" placeholder="seuemail@email.com" required></div><div class="field"><label>Senha</label><input id="novaSenha" type="password" placeholder="Crie sua senha" required></div><div class="field"><label>Confirmar senha</label><input id="confirmarSenha" type="password" placeholder="Confirme sua senha" required></div><button class="modal-btn" type="submit">Criar minha conta</button><div class="error" id="cadastroError"></div></form><button class="close" onclick="fecharModais()">Voltar</button></div></div><script>const loginModal=document.getElementById("loginModal"),cadastroModal=document.getElementById("cadastroModal");function abrirLogin(){loginModal.classList.add("active")}function abrirCadastro(){cadastroModal.classList.add("active")}function fecharModais(){loginModal.classList.remove("active");cadastroModal.classList.remove("active")}function login(e){e.preventDefault();const usuario=document.getElementById("usuario").value.trim(),senha=document.getElementById("senha").value,salvo=JSON.parse(localStorage.getItem("zenithUsuario")||"null"),u=salvo?salvo.usuario:"usuario",s=salvo?salvo.senha:"1234";if(usuario===u&&senha===s){localStorage.setItem("zenithLogado","true");localStorage.setItem("zenithNome",salvo?salvo.nome:"Usuário");window.location.href="inicio.html"}else document.getElementById("loginError").textContent="Usuário ou senha incorretos."}function cadastro(e){e.preventDefault();const nome=document.getElementById("nome").value.trim(),usuario=document.getElementById("novoUsuario").value.trim(),email=document.getElementById("email").value.trim(),senha=document.getElementById("novaSenha").value,confirmar=document.getElementById("confirmarSenha").value;if(senha!==confirmar){document.getElementById("cadastroError").textContent="As senhas não coincidem.";return}if(senha.length<4){document.getElementById("cadastroError").textContent="A senha deve ter pelo menos 4 caracteres.";return}localStorage.setItem("zenithUsuario",JSON.stringify({nome,usuario,email,senha}));localStorage.setItem("zenithLogado","true");localStorage.setItem("zenithNome",nome);window.location.href="inicio.html"}window.addEventListener("click",e=>{if(e.target===loginModal||e.target===cadastroModal)fecharModais()})</script></body></html>
